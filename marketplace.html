<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marketplace · Campus Marketplace</title>
  <link rel="stylesheet" href="/src/styles/main.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-v2.png">
  <meta name="theme-color" content="#0f766e">
</head>
<body>
<div id="site-header"></div>

<main id="main" class="page">
  <div class="container">
    <div class="page-head">
      <div>
        <h1>Marketplace</h1>
        <p>Everything students on your campus are selling right now.</p>
      </div>
      <a class="btn btn-primary mobile-only" href="sell.html"><svg class="icon" aria-hidden="true"><use href="/src/icons.svg#plus"></use></svg>Sell an item</a>
    </div>

    <form id="filters" class="toolbar" role="search">
      <div class="toolbar-row">
        <label class="input-icon search">
          <span class="visually-hidden">Search</span>
          <svg class="icon" aria-hidden="true"><use href="/src/icons.svg#search"></use></svg>
          <input class="input" name="q" type="search" placeholder="Search books, calculators, cycles…">
        </label>
        <button type="button" class="btn btn-secondary filter-toggle" id="filter-toggle" aria-expanded="false" aria-controls="filters"><svg class="icon" aria-hidden="true"><use href="/src/icons.svg#sliders-horizontal"></use></svg><span>Filters</span><span class="count-badge" id="filter-count" hidden></span></button>
        <select class="select" name="condition" aria-label="Condition">
          <option value="">Any condition</option>
          <option>New</option><option>Like New</option><option>Good</option><option>Fair</option><option>Poor</option>
        </select>
        <select class="select" name="pickup" aria-label="Pickup location"><option value="">Any pickup</option></select>
        <select class="select" name="deal" aria-label="Price type">
          <option value="">Any price</option>
          <option value="free">Free items</option>
          <option value="negotiable">Negotiable</option>
        </select>
        <select class="select" name="sort" aria-label="Sort by">
          <option value="">Newest first</option>
          <option value="price_asc">Price: low to high</option>
          <option value="price_desc">Price: high to low</option>
        </select>
      </div>
      <div class="toolbar-row-2">
        <input class="input" name="min" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="Min ₹" aria-label="Minimum price">
        <input class="input" name="max" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="Max ₹" aria-label="Maximum price">
        <div class="chips" id="chips" role="group" aria-label="Category"></div>
      </div>
    </form>

    <section id="recent-section" class="recent" hidden>
      <h2 class="recent-h"><svg class="icon" aria-hidden="true"><use href="/src/icons.svg#history"></use></svg>Recently viewed</h2>
      <ul class="product-grid recent-row" id="recent"></ul>
    </section>

    <div class="results-bar"><span id="count" aria-live="polite"></span></div>
    <ul id="grid" class="product-grid" aria-busy="true"></ul>
    <div class="load-more"><button id="more" type="button" class="btn btn-secondary" hidden>Load more</button></div>
  </div>
</main>

<div id="site-footer"></div>

<script type="module">
  import { supabase, requireUser } from '/src/lib/supabase.js';
  import { icon, categoryIcon, productCard, skeletonCards, stateBlock, nowIso, savedIds, recentlyViewed, PICKUP_LOCATIONS } from '/src/lib/layout.js';

  const PAGE_SIZE = 20;
  const user = await requireUser();

  const form = document.getElementById('filters');
  const f = form.elements;
  const grid = document.getElementById('grid');
  const more = document.getElementById('more');
  const count = document.getElementById('count');
  const chips = document.getElementById('chips');
  let page = 0;
  let category = ''; // category id
  let requestId = 0; // ignore responses that arrive after a newer search started
  const FILTERS = ['q', 'condition', 'pickup', 'deal', 'sort', 'min', 'max'];
  const SELECT = 'id, title, price, quantity, negotiable, pickup_location, condition, image_paths, categories(name), profiles:profiles!products_seller_id_fkey(name)';
  for (const place of PICKUP_LOCATIONS) f.pickup.add(new Option(place, place));

  // Category chips from the database
  const [{ data: categories }, saved] = await Promise.all([
    supabase.from('categories').select('id, name').order('id'),
    savedIds(),
  ]);
  const chip = (id, label, iconName) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.dataset.id = id;
    b.innerHTML = iconName ? icon(iconName) : '';
    b.append(label);
    return b;
  };
  chips.replaceChildren(chip('', 'All'), ...(categories ?? []).map((c) => chip(c.id, c.name, categoryIcon(c.name))));
  const setCategory = (id) => {
    category = String(id);
    chips.querySelectorAll('.chip').forEach((b) => b.setAttribute('aria-pressed', b.dataset.id === category));
  };

  // Restore filters from the URL (?q=, ?category=<name>, ...) so links and refreshes keep them
  const params = new URLSearchParams(location.search);
  for (const name of FILTERS) if (params.get(name)) f[name].value = params.get(name);
  setCategory(categories?.find((c) => c.name === params.get('category'))?.id ?? '');

  function syncUrl() {
    const p = new URLSearchParams();
    for (const name of FILTERS) if (f[name].value) p.set(name, f[name].value);
    const catName = categories?.find((c) => String(c.id) === category)?.name;
    if (catName) p.set('category', catName);
    const query = p.toString();
    history.replaceState(null, '', query ? `?${query}` : location.pathname);
  }

  const hasFilters = () => category || FILTERS.filter((n) => n !== 'sort').some((n) => f[n].value);

  // "calc cas" → 'calc:* & cas:*' so partial words match (prefix search on the full-text index).
  // Only letters and digits get through, so user input can't break the query syntax.
  function toPrefixQuery(text) {
    const words = text.toLowerCase().match(/[\p{L}\p{N}]+/gu) ?? [];
    return words.map((w) => `${w}:*`).join(' & ');
  }

  async function load(reset) {
    if (reset) {
      page = 0;
      grid.replaceChildren(...skeletonCards(8));
      grid.setAttribute('aria-busy', 'true');
      syncUrl();
    }
    const id = ++requestId;
    more.disabled = true;

    let q = supabase
      .from('products')
      .select(SELECT, { count: 'exact' })
      .eq('status', 'available')
      .neq('seller_id', user.id) // your own listings are on your dashboard, not here
      .gt('expires_at', nowIso());

    const search = toPrefixQuery(f.q.value);
    if (search) q = q.textSearch('search', search, { config: 'english' });
    if (category) q = q.eq('category_id', Number(category));
    if (f.condition.value) q = q.eq('condition', f.condition.value);
    if (f.pickup.value) q = q.eq('pickup_location', f.pickup.value);
    if (f.deal.value === 'free') q = q.eq('price', 0);
    if (f.deal.value === 'negotiable') q = q.eq('negotiable', true);
    if (f.min.value) q = q.gte('price', Number(f.min.value));
    if (f.max.value) q = q.lte('price', Number(f.max.value));

    if (f.sort.value === 'price_asc') q = q.order('price', { ascending: true });
    else if (f.sort.value === 'price_desc') q = q.order('price', { ascending: false });
    q = q.order('created_at', { ascending: false }).range(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE - 1);

    const { data, error, count: total } = await q;
    if (id !== requestId) return;
    more.disabled = false;
    grid.setAttribute('aria-busy', 'false');

    if (error) {
      more.hidden = true;
      count.textContent = '';
      return grid.replaceChildren(stateBlock({
        kind: 'error', iconName: 'triangle-alert',
        title: 'Something went wrong', text: 'We could not load listings. Please check your connection and try again.',
        action: { label: 'Try again', onClick: () => load(true) },
      }));
    }

    // Nothing found for a search? Try a typo-tolerant match on titles ("calcualtor" → calculator).
    if (reset && !data.length && search) {
      const similar = await fuzzyResults(f.q.value.trim());
      if (id !== requestId) return;
      if (similar.length) {
        grid.replaceChildren(...similar.map((p) => productCard(p, { saved })));
        count.textContent = `No exact matches. Showing ${similar.length} similar ${similar.length === 1 ? 'item' : 'items'} for “${f.q.value.trim()}”`;
        more.hidden = true;
        return;
      }
    }

    const cards = data.map((p) => productCard(p, { saved }));
    if (reset) grid.replaceChildren(...cards);
    else grid.append(...cards);

    count.textContent = total ? `${total} ${total === 1 ? 'item' : 'items'}` : '';
    more.hidden = grid.children.length >= (total ?? 0);
    document.getElementById('recent-section').hidden = hasFilters() || !recentCount;

    if (!grid.children.length) {
      grid.replaceChildren(hasFilters()
        ? stateBlock({ iconName: 'search', title: 'No listings found', text: 'Try changing your search or filters.', action: { label: 'Clear filters', onClick: clearFilters } })
        : stateBlock({ iconName: 'package', title: 'Nothing for sale yet', text: 'Be the first student to list something.', action: { label: 'Sell an item', href: 'sell.html' } }));
    }
  }

  async function fuzzyResults(text) {
    const { data: ids } = await supabase.rpc('search_products_fuzzy', { q: text.slice(0, 60) });
    if (!ids?.length) return [];
    const order = ids.map((r) => r.id);
    const { data } = await supabase.from('products').select(SELECT).in('id', order).neq('seller_id', user.id);
    return (data ?? []).sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
  }

  // Recently viewed (stored in this browser only)
  let recentCount = 0;
  async function loadRecent() {
    const ids = recentlyViewed();
    if (!ids.length) return;
    const { data } = await supabase.from('products').select(SELECT)
      .in('id', ids).eq('status', 'available').gt('expires_at', nowIso()).neq('seller_id', user.id);
    const items = (data ?? []).sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id)).slice(0, 6);
    recentCount = items.length;
    document.getElementById('recent').replaceChildren(...items.map((p) => productCard(p, { saved })));
    document.getElementById('recent-section').hidden = hasFilters() || !recentCount;
  }

  // Phones: extra filters fold away behind a "Filters" button; its badge counts active ones.
  const toggle = document.getElementById('filter-toggle');
  const updateFilterCount = () => {
    const n = ['condition', 'pickup', 'deal', 'min', 'max'].filter((name) => f[name].value).length;
    document.getElementById('filter-count').textContent = n;
    document.getElementById('filter-count').hidden = !n;
  };
  toggle.addEventListener('click', () => {
    const open = form.classList.toggle('filters-open');
    toggle.setAttribute('aria-expanded', open);
  });
  form.addEventListener('input', updateFilterCount);
  updateFilterCount();
  if (['condition', 'pickup', 'deal', 'min', 'max'].some((name) => f[name].value)) {
    form.classList.add('filters-open');
    toggle.setAttribute('aria-expanded', 'true');
  }

  function clearFilters() {
    form.reset();
    updateFilterCount();
    setCategory('');
    load(true);
  }

  let timer;
  form.addEventListener('input', (e) => {
    const typed = ['q', 'min', 'max'].includes(e.target.name);
    if (e.target.name === 'min' || e.target.name === 'max') e.target.value = e.target.value.replace(/\D/g, '');
    clearTimeout(timer);
    timer = setTimeout(() => load(true), typed ? 300 : 0);
  });
  form.addEventListener('submit', (e) => { e.preventDefault(); clearTimeout(timer); load(true); });
  chips.addEventListener('click', (e) => {
    const b = e.target.closest('.chip');
    if (!b || b.dataset.id === category) return;
    setCategory(b.dataset.id);
    load(true);
  });
  more.addEventListener('click', () => { page++; load(false); });

  load(true);
  loadRecent();
</script>

</body>
</html>
