<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sell an item · Campus Marketplace</title>
  <link rel="stylesheet" href="src/styles/main.css">
</head>
<body>
<main>
  <p><a href="index.html">← Back</a></p>
  <h1>Sell an item</h1>
  <form novalidate>
    <label>Title
      <input name="title" required minlength="3" maxlength="100" placeholder="Casio fx-991ES calculator">
    </label>
    <label>Description
      <textarea name="description" required maxlength="1000" rows="4" placeholder="Condition, how long you used it, what's included"></textarea>
    </label>
    <label>Price (₹)
      <input name="price" type="number" required min="0" max="200000" step="1" inputmode="numeric">
    </label>
    <label>Category
      <select name="category_id" required><option value="">Choose…</option></select>
    </label>
    <label>Condition
      <select name="condition" required>
        <option value="">Choose…</option>
        <option>New</option><option>Like New</option><option>Good</option><option>Fair</option><option>Poor</option>
      </select>
    </label>
    <label>Photos <small id="photos-hint">1–3 photos, resized automatically</small>
      <input name="photos" type="file" accept="image/*" multiple required>
    </label>
    <ul id="previews" class="previews" aria-label="Selected photos"></ul>
    <button type="submit">Publish listing</button>
  </form>
  <p id="msg" class="msg" role="status" aria-live="polite"></p>
</main>

<script type="module">
  import { supabase, requireUser, showMessage } from './src/lib/supabase.js';

  const user = await requireUser();
  const form = document.querySelector('form');
  const f = form.elements; // form.title would be the form's own title attribute
  const previews = document.getElementById('previews');

  const { data: categories } = await supabase.from('categories').select('id, name, icon').order('id');
  for (const c of categories ?? []) f.category_id.add(new Option(`${c.icon} ${c.name}`, c.id));

  const bucket = supabase.storage.from('product-images');

  function showPreviews(images) {
    previews.replaceChildren(...images.map(({ src, alt }) => {
      const img = document.createElement('img');
      img.src = src;
      img.alt = alt;
      const li = document.createElement('li');
      li.append(img);
      return li;
    }));
  }

  // Edit mode: sell.html?id=<product id> loads the seller's own listing into the form.
  const editId = new URLSearchParams(location.search).get('id');
  let existing = null;
  if (editId) {
    const { data } = await supabase.from('products').select('*')
      .eq('id', editId).eq('seller_id', user.id).maybeSingle();
    if (!data) {
      form.hidden = true;
      showMessage('Listing not found, or it is not yours.');
    } else {
      existing = data;
      document.title = 'Edit listing · Campus Marketplace';
      document.querySelector('h1').textContent = 'Edit listing';
      form.querySelector('button').textContent = 'Save changes';
      f.title.value = data.title;
      f.description.value = data.description;
      f.price.value = data.price;
      f.category_id.value = data.category_id;
      f.condition.value = data.condition;
      f.photos.required = false;
      document.getElementById('photos-hint').textContent = 'Choose new photos to replace these, or leave empty to keep them';
      showPreviews(data.image_paths.map((path, i) => ({ src: bucket.getPublicUrl(path).data.publicUrl, alt: `Current photo ${i + 1}` })));
    }
  }

  f.photos.addEventListener('change', () => {
    const files = [...f.photos.files];
    if (files.length > 3) showMessage('Only the first 3 photos will be used.');
    showPreviews(files.slice(0, 3).map((file) => ({ src: URL.createObjectURL(file), alt: file.name })));
  });

  // Resize to max 1080 px and re-encode until ≤ 200 KB. WebP where the browser can
  // encode it, else JPEG (some Safari versions). Both are allowed by the bucket.
  async function compress(file) {
    const bitmap = await createImageBitmap(file);
    const scale = Math.min(1, 1080 / Math.max(bitmap.width, bitmap.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(bitmap.width * scale);
    canvas.height = Math.round(bitmap.height * scale);
    canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    const encode = (type, q) => new Promise((resolve) => canvas.toBlob(resolve, type, q));
    for (let q = 0.85; ; q -= 0.15) {
      let blob = await encode('image/webp', q);
      if (blob.type !== 'image/webp') blob = await encode('image/jpeg', q);
      if (blob.size <= 200_000 || q < 0.5) return blob; // 1080 px at q 0.4 is far below the 1 MB bucket limit
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!form.reportValidity()) return;

    const button = form.querySelector('button');
    button.disabled = true;
    showMessage('Uploading photos…', true);

    const id = existing?.id ?? crypto.randomUUID();
    const files = [...f.photos.files].slice(0, 3);
    const paths = [];
    try {
      for (const [i, file] of files.entries()) {
        const blob = await compress(file).catch(() => {
          throw new Error(`Couldn't read "${file.name}". Please use a JPG or PNG photo.`);
        });
        // Timestamped names: edits never overwrite old photos (which may be cached by the CDN).
        const path = `${user.id}/${id}/${Date.now()}-${i + 1}.${blob.type === 'image/webp' ? 'webp' : 'jpg'}`;
        const { error } = await bucket.upload(path, blob, { contentType: blob.type });
        if (error) throw error;
        paths.push(path);
      }

      const fields = {
        title: f.title.value.trim(),
        description: f.description.value.trim(),
        price: Number(f.price.value),
        category_id: Number(f.category_id.value),
        condition: f.condition.value,
        image_paths: files.length ? paths : existing.image_paths,
      };
      const { error } = existing
        ? await supabase.from('products').update(fields).eq('id', id)
        : await supabase.from('products').insert({ id, seller_id: user.id, ...fields });
      if (error) throw error;

      if (existing && files.length) await bucket.remove(existing.image_paths); // replaced photos

      location.href = `product.html?id=${id}`;
    } catch (err) {
      if (paths.length) await bucket.remove(paths); // don't leave orphan photos eating the 1 GB quota
      showMessage(err.message);
      button.disabled = false;
    }
  });
</script>
</body>
</html>
