<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sell an item · Campus Marketplace</title>
  <link rel="stylesheet" href="/src/styles/main.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0f766e">
</head>
<body>
<div id="site-header"></div>

<main id="main" class="page">
  <div class="container">
    <div class="page-head">
      <div>
        <h1 id="heading">Sell an item</h1>
        <p id="subheading">Add a few details and photos. It goes live right away and stays up for 60 days.</p>
      </div>
    </div>

    <div id="missing" hidden></div>

    <div class="sell-layout" id="layout">
      <form class="stack" novalidate>
        <section class="card">
          <h2 class="card-title" style="font-size: 1.1rem"><span class="num">1</span>Item details</h2>
          <div class="form">
            <label class="field">
              <span class="field-label">Title</span>
              <input class="input" name="title" required minlength="3" maxlength="100" placeholder="e.g. Casio fx-991ES scientific calculator">
            </label>
            <div class="form-grid-2">
              <label class="field">
                <span class="field-label">Category</span>
                <select class="select" name="category_id" required><option value="">Choose a category</option></select>
              </label>
              <label class="field">
                <span class="field-label">Condition</span>
                <select class="select" name="condition" required>
                  <option value="">Choose condition</option>
                  <option>New</option><option>Like New</option><option>Good</option><option>Fair</option><option>Poor</option>
                </select>
              </label>
            </div>
            <div class="form-grid-2">
              <label class="field">
                <span class="field-label">Price per item (₹)</span>
                <div class="input-icon">
                  <svg class="icon" aria-hidden="true"><use href="/src/icons.svg#wallet"></use></svg>
                  <input class="input" name="price" type="text" required inputmode="numeric" pattern="[0-9]{1,6}" maxlength="6" autocomplete="off" placeholder="500">
                </div>
                <span class="field-hint">Whole rupees, up to ₹2,00,000. 0 = free.</span>
              </label>
              <label class="field">
                <span class="field-label">Quantity</span>
                <input class="input" name="quantity" type="text" required inputmode="numeric" pattern="[0-9]{1,2}" maxlength="2" autocomplete="off" value="1">
                <span class="field-hint">How many you have to sell, 1–99.</span>
              </label>
            </div>
            <div class="form-grid-2">
              <label class="field">
                <span class="field-label">Pickup location</span>
                <select class="select" name="pickup_location"><option value="">Decide with the buyer</option></select>
              </label>
              <label class="check" style="align-self: end; padding-bottom: 12px">
                <input type="checkbox" name="negotiable">
                <span>Price is negotiable</span>
              </label>
            </div>
          </div>
        </section>

        <section class="card">
          <h2 class="card-title" style="font-size: 1.1rem"><span class="num">2</span>Description</h2>
          <label class="field">
            <span class="visually-hidden">Description</span>
            <textarea class="textarea" name="description" required maxlength="1000" rows="5" placeholder="Condition, how long you used it, what's included, where on campus you can meet"></textarea>
            <span class="field-hint"><span id="desc-count">0</span>/1000 characters</span>
          </label>
        </section>

        <section class="card">
          <h2 class="card-title" style="font-size: 1.1rem"><span class="num">3</span>Photos</h2>
          <div class="stack">
            <div class="photo-pick" id="dropzone">
              <!-- Separate camera input: with "multiple", Android opens only the gallery picker -->
              <label class="dropzone camera-only">
                <svg class="icon" aria-hidden="true"><use href="/src/icons.svg#camera"></use></svg>
                <strong>Take photo</strong>
                <span class="small">Use your camera</span>
                <input class="visually-hidden" name="camera" type="file" accept="image/*" capture="environment">
              </label>
              <label class="dropzone">
                <svg class="icon" aria-hidden="true"><use href="/src/icons.svg#image-plus"></use></svg>
                <strong>Choose photos</strong>
                <span class="small">From your gallery or files</span>
                <input class="visually-hidden" name="photos" type="file" accept="image/*" multiple>
              </label>
              <p class="field-hint">Up to 3 photos. The first one is the cover. They're resized automatically.</p>
            </div>
            <ul id="previews" class="previews" aria-label="Selected photos"></ul>
          </div>
        </section>

        <p id="msg" class="msg" role="status" aria-live="polite" hidden></p>
        <button type="submit" class="btn btn-primary btn-lg btn-block" id="submit">Publish listing</button>
      </form>

      <aside class="sell-preview" aria-label="Preview">
        <span class="eyebrow"><svg class="icon" aria-hidden="true"><use href="/src/icons.svg#eye"></use></svg>Live preview</span>
        <ul class="product-grid" id="preview" style="grid-template-columns: 1fr"></ul>
        <p class="small muted">This is how your listing will appear in the marketplace.</p>
      </aside>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script type="module">
  import { supabase, requireUser, showMessage, busy } from '/src/lib/supabase.js';
  import { icon, imageUrl, productCard, stateBlock, PICKUP_LOCATIONS, renewedExpiry } from '/src/lib/layout.js';

  const MAX_PHOTOS = 3;
  const user = await requireUser();
  const form = document.querySelector('form');
  const f = form.elements; // form.title would be the form's own title attribute
  const previews = document.getElementById('previews');
  const bucket = supabase.storage.from('product-images');

  // Each photo is either already stored ({ path, src }) or newly picked ({ file, src }).
  let photos = [];

  const [{ data: categories }, { data: me }] = await Promise.all([
    supabase.from('categories').select('id, name').order('id'),
    supabase.from('profiles').select('name').eq('id', user.id).single(),
  ]);
  for (const c of categories ?? []) f.category_id.add(new Option(c.name, c.id));
  for (const place of PICKUP_LOCATIONS) f.pickup_location.add(new Option(place, place));

  // Edit mode: sell.html?id=<product id> loads the seller's own listing into the form.
  const editId = new URLSearchParams(location.search).get('id');
  let existing = null;
  if (editId) {
    const { data } = await supabase.from('products').select('*')
      .eq('id', editId).eq('seller_id', user.id).maybeSingle();
    if (!data) {
      document.getElementById('layout').hidden = true;
      document.getElementById('missing').hidden = false;
      document.getElementById('missing').replaceChildren(stateBlock({
        tag: 'div', iconName: 'search', title: 'Listing not found',
        text: 'It may have been deleted, or it belongs to someone else.',
        action: { label: 'Go to dashboard', href: 'dashboard.html' },
      }));
    } else {
      existing = data;
      document.title = 'Edit listing · Campus Marketplace';
      document.getElementById('heading').textContent = 'Edit listing';
      document.getElementById('subheading').textContent = 'Changes are visible on the marketplace as soon as you save.';
      document.getElementById('submit').textContent = 'Save changes';
      f.title.value = data.title;
      f.description.value = data.description;
      f.price.value = data.price;
      f.category_id.value = data.category_id;
      f.condition.value = data.condition;
      f.quantity.value = data.quantity ?? 1;
      f.pickup_location.value = data.pickup_location ?? '';
      f.negotiable.checked = data.negotiable;
      photos = data.image_paths.map((path) => ({ path, src: imageUrl(path) }));
    }
  }

  // ---------- Photos ----------

  function renderPhotos() {
    previews.replaceChildren(...photos.map((photo, i) => {
      const li = document.createElement('li');
      const img = document.createElement('img');
      img.src = photo.src;
      img.alt = `Photo ${i + 1}`;
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'remove';
      remove.setAttribute('aria-label', `Remove photo ${i + 1}`);
      remove.innerHTML = icon('x');
      remove.addEventListener('click', () => {
        photos.splice(i, 1);
        renderPhotos();
      });
      li.append(img, remove);
      if (i === 0) li.insertAdjacentHTML('beforeend', '<span class="badge badge-brand cover">Cover</span>');
      return li;
    }));
    document.getElementById('dropzone').hidden = photos.length >= MAX_PHOTOS;
    renderPreview();
  }

  for (const input of [f.photos, f.camera]) {
    input.addEventListener('change', () => {
      const picked = [...input.files];
      const room = MAX_PHOTOS - photos.length;
      if (picked.length > room) showMessage(`Only ${MAX_PHOTOS} photos allowed. Extra photos were skipped.`);
      photos.push(...picked.slice(0, room).map((file) => ({ file, src: URL.createObjectURL(file) })));
      input.value = ''; // allow picking the same file again after removing it
      renderPhotos();
    });
  }

  // ---------- Live preview ----------

  function renderPreview() {
    const option = f.category_id.selectedOptions[0];
    const card = productCard({
      title: f.title.value.trim(),
      price: f.price.value,
      quantity: Number(f.quantity.value),
      negotiable: f.negotiable.checked,
      pickup_location: f.pickup_location.value,
      condition: f.condition.value,
      categories: { name: option?.value ? option.text : '' },
      profiles: { name: me?.name },
    }, { imageSrc: photos[0]?.src });
    document.getElementById('preview').replaceChildren(card);
  }
  form.addEventListener('input', (e) => {
    if (e.target === f.price || e.target === f.quantity) e.target.value = e.target.value.replace(/\D/g, ''); // digits only, e.g. pasted "1,250"
    document.getElementById('desc-count').textContent = f.description.value.length;
    renderPreview();
  });
  document.getElementById('desc-count').textContent = f.description.value.length;
  renderPhotos();

  // Resize to max 1080 px and re-encode until ≤ 200 KB. WebP where the browser can
  // encode it, else JPEG (some Safari versions). Both are allowed by the bucket.
  async function compress(file) {
    const bitmap = await createImageBitmap(file);
    const scale = Math.min(1, 1080 / Math.max(bitmap.width, bitmap.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(bitmap.width * scale);
    canvas.height = Math.round(bitmap.height * scale);
    canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    const encode = (type, q) => new Promise((resolve) => canvas.toBlob(resolve, type, q));
    for (let q = 0.85; ; q -= 0.15) {
      let blob = await encode('image/webp', q);
      if (blob.type !== 'image/webp') blob = await encode('image/jpeg', q);
      if (blob.size <= 200_000 || q < 0.5) return blob; // 1080 px at q 0.4 is far below the 1 MB bucket limit
    }
  }

  // ---------- Submit ----------

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!form.reportValidity()) return;
    if (Number(f.price.value) > 200000) return showMessage('Price can be at most ₹2,00,000.');
    const quantity = Number(f.quantity.value);
    if (quantity < 1 || quantity > 99) return showMessage('Quantity must be between 1 and 99.');
    if (!photos.length) return showMessage('Add at least one photo.');

    const button = document.getElementById('submit');
    const id = existing?.id ?? crypto.randomUUID();
    const uploaded = [];

    await busy(button, photos.some((p) => p.file) ? 'Uploading photos…' : 'Saving…', async () => {
      try {
        const imagePaths = [];
        for (const [i, photo] of photos.entries()) {
          if (photo.path) { imagePaths.push(photo.path); continue; }
          const blob = await compress(photo.file).catch(() => {
            throw new Error(`Couldn't read "${photo.file.name}". Please use a JPG or PNG photo.`);
          });
          // Timestamped names: edits never overwrite old photos (which may be cached by the CDN).
          const path = `${user.id}/${id}/${Date.now()}-${i + 1}.${blob.type === 'image/webp' ? 'webp' : 'jpg'}`;
          const { error } = await bucket.upload(path, blob, { contentType: blob.type });
          if (error) throw error;
          uploaded.push(path);
          imagePaths.push(path);
        }

        const fields = {
          title: f.title.value.trim(),
          description: f.description.value.trim(),
          price: Number(f.price.value),
          quantity,
          pickup_location: f.pickup_location.value || null,
          negotiable: f.negotiable.checked,
          expires_at: renewedExpiry(), // saving keeps the listing live for another 60 days
          category_id: Number(f.category_id.value),
          condition: f.condition.value,
          image_paths: imagePaths,
        };
        const { error } = existing
          ? await supabase.from('products').update(fields).eq('id', id)
          : await supabase.from('products').insert({ id, seller_id: user.id, ...fields });
        if (error) throw error;

        // Photos removed while editing are deleted from storage.
        const removed = existing?.image_paths.filter((path) => !imagePaths.includes(path)) ?? [];
        if (removed.length) await bucket.remove(removed);

        location.href = `product.html?id=${id}`;
      } catch (err) {
        if (uploaded.length) await bucket.remove(uploaded); // don't leave orphan photos eating the 1 GB quota
        showMessage(err.message);
      }
    });
  });
</script>

</body>
</html>
