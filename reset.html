<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password · Campus Marketplace</title>
  <link rel="stylesheet" href="/src/styles/main.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0f766e">
</head>
<body>
<div class="auth">
  <aside class="auth-brand">
    <a class="logo" href="/"><span class="logo-mark"><svg class="icon" aria-hidden="true"><use href="/src/icons.svg#tag"></use></svg></span>Campus Marketplace</a>
    <div class="auth-brand-body">
      <h2>Back in<br><em>a moment.</em></h2>
      <p>Choose a new password and you'll go straight to the marketplace.</p>
    </div>
  </aside>

  <main class="auth-main" id="main">
    <div class="auth-card">
      <h1>Set a new password</h1>
      <p class="sub">Use at least 6 characters.</p>
      <p id="msg" class="msg" role="status" aria-live="polite" hidden></p>

      <form class="form" novalidate hidden>
        <label class="field">
          <span class="field-label">New password</span>
          <input class="input" name="password" type="password" required minlength="6" autocomplete="new-password">
        </label>
        <label class="field">
          <span class="field-label">Confirm new password</span>
          <input class="input" name="confirm" type="password" required autocomplete="new-password">
        </label>
        <button type="submit" class="btn btn-primary btn-lg btn-block">Save password</button>
      </form>
      <p class="auth-foot"><a href="login.html">Back to login</a></p>
    </div>
  </main>
</div>

<script type="module">
  import { supabase, showMessage, busy } from '/src/lib/supabase.js';

  const form = document.querySelector('form');

  // supabase-js signs the user in from the link in the reset email.
  const { data: { session } } = await supabase.auth.getSession();
  if (session) form.hidden = false;
  else showMessage('This reset link is invalid or has expired. Request a new one from the login page.');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!form.reportValidity()) return;
    if (form.password.value !== form.confirm.value) return showMessage('Passwords do not match.');

    const { error } = await busy(form.querySelector('[type=submit]'), 'Saving…', () =>
      supabase.auth.updateUser({ password: form.password.value }));
    if (error) return showMessage(error.message);
    location.replace('/marketplace.html');
  });
</script>
</body>
</html>
