<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Marketplace</title>
  <link rel="stylesheet" href="src/styles/main.css">
</head>
<body>
<main>
  <h1>Campus Marketplace</h1>
  <p id="hello">Loading…</p>
  <p>The marketplace is coming in the next phase.</p>
  <button id="logout" type="button">Log out</button>
</main>

<script type="module">
  import { supabase, requireUser } from './src/lib/supabase.js';

  const user = await requireUser();
  if (user) {
    const { data } = await supabase.from('profiles').select('name, roll_no').eq('id', user.id).single();
    document.getElementById('hello').textContent = data
      ? `Logged in as ${data.name} (${data.roll_no})`
      : `Logged in as ${user.email}`;
  }

  document.getElementById('logout').addEventListener('click', async () => {
    await supabase.auth.signOut();
    location.replace('login.html');
  });
</script>
</body>
</html>
